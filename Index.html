
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKAP - Sistem Kependudukan Terpadu</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel untuk menjalankan React di Browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- KONFIGURASI DATABASE ---
        // Catatan: Dalam lingkungan ini, Firebase sudah diatur secara otomatis.
        // Jika Anda memindahkan ini ke hosting sendiri, Anda perlu memasukkan config Firebase Anda di sini.
        const appId = "sikap-desa-mandiri";

        function App() {
            const [records, setRecords] = useState([]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [formData, setFormData] = useState({
                nik: '', nama: '', noKk: '', dusun: '', rw: '', rt: '',
                desil: '1', bansos: [], jaminan: 'BPJS PBI', lat: '', lng: '', fotoUrl: ''
            });
            const [editingId, setEditingId] = useState(null);
            const [notif, setNotif] = useState(null);

            // Simulasi Penyimpanan (Bisa ditingkatkan ke Firebase sungguhan nanti)
            useEffect(() => {
                const saved = localStorage.getItem('data_sikap');
                if (saved) setRecords(JSON.parse(saved));
                lucide.createIcons();
            }, []);

            useEffect(() => {
                localStorage.setItem('data_sikap', JSON.stringify(records));
                lucide.createIcons();
            }, [records, activeTab]);

            const showNotif = (msg) => {
                setNotif(msg);
                setTimeout(() => setNotif(null), 3000);
            };

            const handleLocation = () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        setFormData({...formData, lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6)});
                        showNotif("Lokasi GPS Terkunci!");
                    });
                }
            };

            const handlePhoto = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setFormData({...formData, fotoUrl: reader.result});
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingId) {
                    setRecords(records.map(r => r.id === editingId ? {...formData, id: editingId} : r));
                    showNotif("Data Berhasil Diperbarui");
                } else {
                    setRecords([...records, {...formData, id: Date.now().toString()}]);
                    showNotif("Data Berhasil Ditambahkan");
                }
                setFormData({nik: '', nama: '', noKk: '', dusun: '', rw: '', rt: '', desil: '1', bansos: [], jaminan: 'BPJS PBI', lat: '', lng: '', fotoUrl: ''});
                setEditingId(null);
                setActiveTab('table');
            };

            const stats = useMemo(() => ({
                jiwa: records.length,
                kk: new Set(records.map(r => r.noKk)).size,
                bansos: records.filter(r => r.bansos.length > 0).length
            }), [records]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {/* Sidebar / Navigasi Bawah untuk HP */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t md:relative md:w-64 md:border-t-0 md:border-r p-4 flex md:flex-col justify-around md:justify-start gap-2 z-50">
                        <div className="hidden md:flex items-center gap-2 mb-8 p-2">
                            <div className="bg-blue-600 text-white p-2 rounded-lg"><i data-lucide="cloud"></i></div>
                            <span className="font-extrabold text-xl">SIKAP</span>
                        </div>
                        <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col md:flex-row items-center gap-3 p-3 rounded-xl w-full ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>
                            <i data-lucide="layout-dashboard"></i> <span className="text-[10px] md:text-sm font-bold">Beranda</span>
                        </button>
                        <button onClick={() => setActiveTab('table')} className={`flex flex-col md:flex-row items-center gap-3 p-3 rounded-xl w-full ${activeTab === 'table' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>
                            <i data-lucide="users"></i> <span className="text-[10px] md:text-sm font-bold">Data</span>
                        </button>
                        <button onClick={() => setActiveTab('form')} className={`flex flex-col md:flex-row items-center gap-3 p-3 rounded-xl w-full ${activeTab === 'form' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>
                            <i data-lucide="plus-circle"></i> <span className="text-[10px] md:text-sm font-bold">Input</span>
                        </button>
                    </nav>

                    {/* Konten Utama */}
                    <main className="flex-1 p-4 md:p-8 pb-24 md:pb-8 overflow-y-auto">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-extrabold text-slate-800">Dashboard Desa</h2>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="bg-white p-4 rounded-3xl border shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase">Total Jiwa</p>
                                        <p className="text-2xl font-black text-blue-600">{stats.jiwa}</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-3xl border shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase">Total KK</p>
                                        <p className="text-2xl font-black text-purple-600">{stats.kk}</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-3xl border shadow-sm">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase">Bansos</p>
                                        <p className="text-2xl font-black text-amber-600">{stats.bansos}</p>
                                    </div>
                                </div>
                                <div className="bg-blue-600 text-white p-6 rounded-[2rem] shadow-xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h3 className="font-bold text-lg">Selamat Datang di SIKAP</h3>
                                        <p className="text-blue-100 text-sm">Sistem Informasi Kependudukan & Profil Desa. Gunakan menu di bawah (HP) atau di samping (Laptop) untuk mengelola data.</p>
                                    </div>
                                    <i data-lucide="map" className="absolute -right-4 -bottom-4 w-32 h-32 opacity-20"></i>
                                </div>
                            </div>
                        )}

                        {activeTab === 'table' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-extrabold text-slate-800">Data Penduduk</h2>
                                <div className="grid gap-3">
                                    {records.map(r => (
                                        <div key={r.id} className="bg-white p-4 rounded-2xl border flex items-center justify-between shadow-sm">
                                            <div className="flex items-center gap-4">
                                                {r.fotoUrl ? <img src={r.fotoUrl} className="w-12 h-12 rounded-xl object-cover" /> : <div className="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-300"><i data-lucide="user"></i></div>}
                                                <div>
                                                    <p className="font-bold text-slate-800 leading-tight">{r.nama}</p>
                                                    <p className="text-[10px] text-slate-400">NIK: {r.nik}</p>
                                                    <p className="text-[10px] font-bold text-blue-600 uppercase tracking-tighter">Dusun {r.dusun} RT{r.rt}/RW{r.rw}</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => {setFormData(r); setEditingId(r.id); setActiveTab('form');}} className="p-2 bg-slate-50 text-slate-400 rounded-lg"><i data-lucide="edit-3" className="w-4 h-4"></i></button>
                                                <button onClick={() => setRecords(records.filter(x => x.id !== r.id))} className="p-2 bg-rose-50 text-rose-500 rounded-lg"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                            </div>
                                        </div>
                                    ))}
                                    {records.length === 0 && <p className="text-center py-20 text-slate-400">Belum ada data.</p>}
                                </div>
                            </div>
                        )}

                        {activeTab === 'form' && (
                            <form onSubmit={handleSubmit} className="bg-white p-6 rounded-[2rem] border shadow-sm space-y-6 mb-10">
                                <h2 className="text-xl font-black text-slate-800">{editingId ? 'Edit Data' : 'Tambah Data Penduduk'}</h2>
                                
                                <div className="space-y-4">
                                    <div className="grid gap-4">
                                        <input type="text" placeholder="Nama Lengkap" value={formData.nama} onChange={(e) => setFormData({...formData, nama: e.target.value})} className="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold" required />
                                        <input type="number" placeholder="NIK (16 Digit)" value={formData.nik} onChange={(e) => setFormData({...formData, nik: e.target.value})} className="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold" required />
                                        <input type="number" placeholder="Nomor KK" value={formData.noKk} onChange={(e) => setFormData({...formData, noKk: e.target.value})} className="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold" required />
                                    </div>
                                    
                                    <div className="grid grid-cols-3 gap-3">
                                        <input type="text" placeholder="Dusun" value={formData.dusun} onChange={(e) => setFormData({...formData, dusun: e.target.value})} className="bg-slate-50 p-4 rounded-2xl outline-none text-center font-bold" />
                                        <input type="text" placeholder="RW" value={formData.rw} onChange={(e) => setFormData({...formData, rw: e.target.value})} className="bg-slate-50 p-4 rounded-2xl outline-none text-center font-bold" />
                                        <input type="text" placeholder="RT" value={formData.rt} onChange={(e) => setFormData({...formData, rt: e.target.value})} className="bg-slate-50 p-4 rounded-2xl outline-none text-center font-bold" />
                                    </div>

                                    <div className="flex gap-2">
                                        <button type="button" onClick={handleLocation} className="flex-1 bg-blue-50 text-blue-600 p-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                                            <i data-lucide="map-pin" className="w-4 h-4"></i> GPS
                                        </button>
                                        <label className="flex-1 bg-slate-50 text-slate-400 p-4 rounded-2xl font-bold flex items-center justify-center gap-2 cursor-pointer">
                                            <i data-lucide="camera" className="w-4 h-4"></i> Foto
                                            <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhoto} />
                                        </label>
                                    </div>
                                    
                                    {formData.fotoUrl && <img src={formData.fotoUrl} className="w-full h-40 object-cover rounded-2xl" />}
                                    
                                    <button type="submit" className="w-full bg-blue-600 text-white p-5 rounded-2xl font-black shadow-lg shadow-blue-200 uppercase tracking-widest">
                                        Simpan Data
                                    </button>
                                </div>
                            </form>
                        )}
                    </main>

                    {/* Notifikasi */}
                    {notif && (
                        <div className="fixed top-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-[100] font-bold text-sm">
                            {notif}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
